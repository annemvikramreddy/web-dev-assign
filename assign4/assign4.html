<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Dashboard</title>
  <link rel="stylesheet" href="assign4.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <h2>Dashboard</h2>
      <ul>
        <li><a href="#">Profile</a></li>
        <li><a href="#">Messages</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="header">
        <h1>Welcome, Student</h1>
        <div class="notification-badge">3</div>
      </header>

      <section class="profile-card">
        <img src="your-image.jpg" class="profile-pic" alt="Profile Picture" />
        <div class="profile-details">
          <h2>Your Name</h2>
          <p>Student, Web Developer Enthusiast</p>
        </div>
      </section>

      <section class="info-cards">
        <div class="card">Card 1: Bio</div>
        <div class="card">Card 2: Skills</div>
        <div class="card">Card 3: Projects</div>
      </section>
    </main>
  </div>
</body>
</html>
